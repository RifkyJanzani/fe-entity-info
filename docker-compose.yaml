services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080/api/v1}"
    image: "${SERVICE_NAME_DOCKER:-fe-entity-info}:${BUILD_TAG:-latest}"
    container_name: "${SERVICE_NAME_DOCKER:-fe-entity-info}"
    ports:
      - "${PORT:-8123}:80"
    restart: unless-stopped
